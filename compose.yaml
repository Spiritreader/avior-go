services:
  avior-go:
    build: .
    container_name: avior-go
    hostname: avior-go   # client registers as AVIOR-GO in Mongo instead of the container ID
    environment:
      - PUID=${PUID:-0}   # run app as this user id (host uid, e.g. mm's uid) so created
      - PGID=${PGID:-0}   # files/logs are owned by it; default root
    restart: unless-stopped
    ports:
      - "10000:10000"
    volumes:
      - /mnt/user/media:/media
      - /mnt/user/recording_pool:/recording_pool
      - /mnt/disks/recording_spare:/recording_spare
      - /mnt/user/appdata/avior-go:/data
    devices:
      - /dev/dri:/dev/dri   # Intel ARC GPU for QSV hardware acceleration
    cap_add:
      - SYS_NICE   # allows negative nice values for encoder priority
