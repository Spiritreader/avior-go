services:
  avior-go-test:
    build: .
    container_name: avior-go-test
    hostname: avior-go-test   # client registers as AVIOR-GO-TEST in Mongo instead of the container ID
    environment:
      - PUID=${PUID:-1002}   # run app as this user id (host uid of mm) so created
      - PGID=${PGID:-100}    # files/logs are owned by mm:users; default root
    restart: unless-stopped
    ports:
      - "10100:10000"
    healthcheck:
      # /alive/ always answers 200 while the process runs; curl is present in
      # the linuxserver/ffmpeg base image (verified: /usr/bin/curl).
      test: ["CMD-SHELL", "curl -fsS http://localhost:10000/alive/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      - /mnt/user/media:/media
      - /mnt/user/recording_pool:/recording_pool
      # The exists/ symlinks inside the recording pool point to the host path
      # /mnt/user/recording_pool/recording/exists (central exists storage).
      # Without this mount the link target is unresolvable inside the container.
      - /mnt/user/recording_pool:/mnt/user/recording_pool
      - /mnt/disks/recording_spare:/recording_spare
      - /mnt/user/appdata/avior-go-test:/data
    cap_add:
      - SYS_NICE   # allows negative nice values for encoder priority
