services:
  avior-go-test:
    build: .
    container_name: avior-go-test
    hostname: avior-go-test   # client registers as AVIOR-GO-TEST in Mongo instead of the container ID
    environment:
      - TZ=${TZ:-Europe/Berlin}   # local time for logs (app uses time.Local)
      # Unraid standard: run as nobody:users so files are owned like every
      # other share file and SMB/tools work without per-user PUID config.
      # Override via PUID/PGID env when a dedicated service user is wanted.
      - PUID=${PUID:-99}
      - PGID=${PGID:-100}
    restart: unless-stopped
    ports:
      - "10100:10000"
    healthcheck:
      # /alive/ always answers 200 while the process runs; curl is present in
      # the linuxserver/ffmpeg base image (verified: /usr/bin/curl).
      test: ["CMD-SHELL", "curl -fsS http://localhost:10000/alive/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      - /mnt/user/media:/media
      - /mnt/user/recording_pool:/recording_pool
      - /mnt/disks/recording_spare:/recording_spare
      - /mnt/user/appdata/avior-go-test:/data
    cap_add:
      - SYS_NICE   # allows negative nice values for encoder priority
