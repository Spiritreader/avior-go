# Multi-instance compose: one file, parameterized per stack via environment.
# Each Komodo stack sets INSTANCE_SUFFIX, HOST_PORT, CONTAINER_PORT and DATA_DIR
# (plus optional GPU_DEVICE). CONTAINER_PORT must equal 10000 + Instance from the
# instance's config.json (the app listens on 10000+Instance). Container name is
# derived from the Compose project name, set per stack via project_name.
services:
  avior-go:
    build: .
    hostname: avior-go${INSTANCE_SUFFIX:-}   # client fallback name; ClientName in config.json wins
    environment:
      - TZ=${TZ:-Europe/Berlin}   # local time for logs (app uses time.Local)
      - PUID=${PUID:-1002}   # run app as this user id (host uid of mm) so created
      - PGID=${PGID:-100}    # files/logs are owned by mm:users; default root
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-10000}:${CONTAINER_PORT:-10000}"
    volumes:
      - /mnt/user/media:/media
      - /mnt/user/recording_pool:/recording_pool
      - /mnt/disks/recording_spare:/recording_spare
      - ${DATA_DIR:-/mnt/user/appdata/avior-go}:/data
    devices:
      - ${GPU_DEVICE:-/dev/dri}:/dev/dri   # Intel ARC GPU for QSV hardware acceleration
    cap_add:
      - SYS_NICE   # allows negative nice values for encoder priority
