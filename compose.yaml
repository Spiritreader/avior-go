services:
  avior-go:
    build: .
    image: avior-go:latest
    container_name: avior-go
    restart: unless-stopped
    ports:
      - "10000:10000"
    volumes:
      - /mnt/user/media:/media
      - /mnt/user/appdata/avior-go:/data
    # Uncomment for Intel QSV hardware acceleration (requires /dev/dri on host):
    # devices:
    #   - /dev/dri:/dev/dri
    cap_add:
      - SYS_NICE   # allows negative nice values (EncoderPriority HIGH/ABOVE_NORMAL);
                   # without this capability encoding still works, just with a log warning
